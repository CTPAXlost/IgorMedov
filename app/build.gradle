plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.karma.remontnik'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.karma.remontnik'
        minSdk 24
        targetSdk 35
        versionCode 5
        versionName '1.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
