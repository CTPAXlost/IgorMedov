<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Ремонтник: Старый дом</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <canvas id="game" width="1280" height="720" aria-label="Игра Ремонтник"></canvas>
    <div id="touchControls" class="touch-controls" aria-hidden="true">
      <div class="touch-left">
        <button id="btnLeft" class="round-btn">◀</button>
        <button id="btnRight" class="round-btn">▶</button>
      </div>
      <div class="touch-right">
        <button id="btnHammer" class="round-btn hammer">🔨</button>
        <button id="btnJump" class="round-btn jump">↑</button>
      </div>
    </div>
  </main>
  <script src="game.js"></script>
</body>
</html>
