name: Сборка APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Получить исходники
        uses: actions/checkout@v6

      # В ранней версии проекта был нестандартный Gradle Wrapper.
      # Проект собирается официальной установкой Gradle, поэтому старые
      # wrapper-файлы удаляются до запуска проверки и сборки.
      - name: Удалить старый нестандартный Gradle Wrapper
        shell: bash
        run: rm -rf gradle/wrapper gradlew gradlew.bat

      - name: Установить Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Этот action устанавливает Android command-line tools, добавляет
      # sdkmanager в PATH, принимает лицензии и ставит нужные пакеты SDK.
      - name: Установить Android SDK 35
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          log-accepted-android-sdk-licenses: "false"

      - name: Установить официальный Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Проверить окружение
        shell: bash
        run: |
          java -version
          gradle --version
          sdkmanager --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Собрать debug APK
        shell: bash
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Подготовить понятное имя APK
        shell: bash
        run: cp app/build/outputs/apk/debug/app-debug.apk "Ремонтник-Старый-дом.apk"

      - name: Загрузить APK
        uses: actions/upload-artifact@v7
        with:
          name: Ремонтник-Старый-дом-APK
          path: Ремонтник-Старый-дом.apk
          if-no-files-found: error
          retention-days: 30
