name: Сборка APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Получить исходники
        uses: actions/checkout@v6

      # В старой версии проекта находился самодельный gradle-wrapper.jar,
      # который GitHub справедливо блокировал как неизвестный. Удаляем его
      # до проверки и используем официальный Gradle, установленный action-ом.
      - name: Удалить старый нестандартный Gradle Wrapper
        shell: bash
        run: rm -rf gradle/wrapper gradlew gradlew.bat

      - name: Установить Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Установить официальный Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Подготовить Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Проверить окружение
        shell: bash
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Собрать debug APK
        shell: bash
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Подготовить понятное имя APK
        shell: bash
        run: cp app/build/outputs/apk/debug/app-debug.apk "Ремонтник-Старый-дом.apk"

      - name: Загрузить APK
        uses: actions/upload-artifact@v7
        with:
          name: Ремонтник-Старый-дом-APK
          path: Ремонтник-Старый-дом.apk
          if-no-files-found: error
          retention-days: 30
