name: Сборка APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Получение проекта
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Проверка проекта
        run: gradle --no-daemon :app:lintDebug

      - name: Сборка APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Подготовка результата
        run: |
          mkdir -p result
          cp app/build/outputs/apk/debug/app-debug.apk "result/Ремонтник-Старый-дом.apk"
          sha256sum "result/Ремонтник-Старый-дом.apk" > "result/Ремонтник-Старый-дом.apk.sha256.txt"

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: Ремонтник-Старый-дом-APK
          path: result/*
          if-no-files-found: error
          retention-days: 30
